<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f32">
  <meta name="description" content="Watch the Bus o’Clock app demo. Plan your Hong Kong bus commute on Android or the web.">
  <title>Bus o’Clock — Watch the demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7ef; color: #173f32; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 32px, 460px); margin: 0 auto; padding: 24px 0 30px; text-align: center; }
    h1 { margin: 0 0 5px; font-size: 28px; letter-spacing: -.7px; }
    p { margin: 0 0 18px; color: #557064; font-size: 15px; }
    video { display: block; width: 100%; max-height: 76svh; aspect-ratio: 9 / 16; margin: 0 auto; background: #edf1e7; border-radius: 18px; box-shadow: 0 12px 36px #173f3218; }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    a { color: #173f32; padding: 10px 16px; border: 1px solid #cbd8ca; border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 600; }
    a:hover, a:focus-visible { background: #e4eddb; outline-offset: 4px; }
    .primary { background: #173f32; color: white; border-color: #173f32; }
    .primary:hover, .primary:focus-visible { background: #285b46; }
    .caption { margin: 15px 0 0; font-size: 12px; }
    @media (max-width: 480px) { main { padding-top: 16px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main>
    <h1>Bus o’Clock</h1>
    <p>Know when to head out.</p>
    <video controls playsinline autoplay preload="metadata" poster="./cover.jpg" aria-label="Bus o’Clock English app demonstration">
      <source src="./bus-o-clock-demo.mp4" type="video/mp4">
      <track kind="captions" src="./captions.vtt" srclang="en" label="English">
      Your browser does not support video playback. <a href="./bus-o-clock-demo.mp4">Open the video</a>.
    </video>
    <nav aria-label="Demo links">
      <a class="primary" href="../">Open the app</a>
      <a href="./bus-o-clock-demo.mp4" download>Download video</a>
    </nav>
    <p class="caption">English demo · Android + Web</p>
  </main>
</body>
</html>
