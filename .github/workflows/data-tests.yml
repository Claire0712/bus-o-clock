name: Data layer tests
on:
  push:
    paths: ['packages/data/**', '.github/workflows/data-tests.yml']
  pull_request:
    paths: ['packages/data/**', '.github/workflows/data-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic backend tests
        run: node --test packages/data/test/*.test.js
